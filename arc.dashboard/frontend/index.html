<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ARC Real-Time Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 16px; background: #111827; color: #e5e7eb; }
    .row { display: flex; gap: 16px; flex-wrap: wrap; }
    .card { background: #1f2937; border-radius: 12px; padding: 12px 16px; min-width: 220px; }
    .state { font-size: 28px; font-weight: 700; }
    button { padding: 8px 12px; border: 0; border-radius: 8px; background: #2563eb; color: #fff; cursor: pointer; }
    canvas { background: #0b1220; border-radius: 8px; padding: 8px; }
    table { width: 100%; border-collapse: collapse; }
    td { border-bottom: 1px solid #374151; padding: 6px; }
  </style>
</head>
<body>
  <h2>ARC Real-Time Dashboard</h2>
  <div class="row">
    <div class="card"><div>Arousal (A)</div><div id="aVal">0.00</div></div>
    <div class="card"><div>Regulation (R)</div><div id="rVal">0.00</div></div>
    <div class="card"><div>Coherence (C)</div><div id="cVal">0.00</div></div>
    <div class="card"><div>State</div><div class="state" id="stateVal">YELLOW</div></div>
  </div>
  <br />
  <div class="row">
    <button id="connectWs">Connect WebSocket</button>
    <button id="startPolling">Start /api/process-data Polling</button>
  </div>
  <br />
  <canvas id="arcChart" width="900" height="300"></canvas>
  <br />
  <div class="card">
    <h3>HRV Features</h3>
    <table id="featureTable"></table>
  </div>
  <script src="./app.js"></script>
</body>
</html>
